<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Visitação — Momment (1080×1350)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="post-visitacao.css">
<script>if (location.search.includes('export')) document.documentElement.classList.add('exp');</script>
</head>
<body class="export">

<div class="post" id="post">
  <div class="post__photo">
    <img src="../assets/img (1).png" alt="Salão da Momment Coworking">
  </div>
  <div class="post__overlay"></div>
  <div class="post__noise"></div>

  <div class="post__content">
    <img class="post__logo" src="../assets/logo-horizontal-branca.svg" alt="Momment Coworking">

    <div class="post__bottom">
      <span class="post__tag">Visitação aberta</span>

      <h1 class="post__dates">
        01 · 02 · 03
        <small>de junho</small>
      </h1>

      <p class="post__sub">Venha conhecer a Momment por dentro.</p>

      <div class="post__info">
        <div class="post__info-row"><i class="ph ph-clock" aria-hidden="true"></i><span>Das 9h às 19h · é só chegar</span></div>
        <div class="post__info-row"><i class="ph ph-map-pin" aria-hidden="true"></i><span>Rua das Araucárias, 000 — Arapongas/PR</span></div>
      </div>

      <span class="post__cta"><i class="ph-fill ph-coffee" aria-hidden="true"></i>Café por nossa conta</span>
    </div>
  </div>
</div>

</body>
</html>
